<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Layar Presentasi Hadits</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="css/hadith-presentation.css">
</head>
<body>
  <main class="hp-stage" aria-label="Layar hadits">
    <section class="hp-lower-third" id="hadith-card" hidden>
      <div class="hp-content" id="hadith-content">
        <div id="hadith-arabic" class="hp-arabic" lang="ar" dir="rtl" hidden></div>
        <div id="hadith-images" class="hp-images" hidden></div>
        <div id="hadith-translation" class="hp-translation" lang="id" dir="ltr" hidden></div>
      </div>
      <div class="hp-reference" id="hadith-reference" dir="auto" hidden></div>
    </section>
  </main>
  <script src="js/hadith-engine.js"></script>
  <script src="js/hadith-presentation.js"></script>
</body>
</html>
